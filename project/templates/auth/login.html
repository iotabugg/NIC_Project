{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — EMS Portal</title>
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">

  <div class="bg-white shadow-md rounded-lg w-full max-w-md p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-blue-900 uppercase tracking-wide">EMS Portal</h1>
      <p class="text-sm text-gray-500 mt-1">Employee Management System</p>
    </div>

    <!-- Error banner (filled by JS) -->
    <div id="login-error"
         class="hidden mb-4 px-4 py-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded">
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>

      <button type="submit" id="login-btn"
              class="w-full bg-blue-900 text-white py-2 rounded text-sm font-semibold
                     hover:bg-blue-800 transition disabled:opacity-50">
        Sign In
      </button>
    </form>

  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('login-btn');
      const errorBox = document.getElementById('login-error');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      errorBox.classList.add('hidden');

      try {
        const res = await fetch('/api/users/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('access_token', data.access);
          localStorage.setItem('refresh_token', data.refresh);
          window.location.href = '/dashboard/';
        } else {
          errorBox.textContent = data.detail || 'Invalid username or password.';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.textContent = 'Network error. Please try again.';
        errorBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>

</body>
</html>
