{% extends 'base.html' %}

{% block title %}{{ title }} — EMS Portal{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          {{ form.name }}
          {% if form.name.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.name.errors.0 }}</p>
          {% endif %}
        </div>
      </div>
      <div class="flex items-center gap-3 mt-6 pt-5 border-t border-gray-100">
        <button type="submit" class="bg-blue-900 text-white text-sm px-5 py-2 rounded hover:bg-blue-800 transition">
          {{ action }} Permission
        </button>
        <a href="{% url 'users-permissions' %}" class="text-sm text-gray-500 hover:text-gray-700">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
