{% extends 'base.html' %}

{% block title %}Transfer User — EMS Portal{% endblock %}
{% block page_title %}Transfer User{% endblock %}

{% block content %}
<div class="max-w-3xl">
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form id="transfer-user-form" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">User</label>
          <select id="user" required
                  class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Loading users...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
          <select id="state" required
                  class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select a state</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">District</label>
        <select id="district" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Select a district</option>
        </select>
      </div>

      <div id="form-error" class="hidden text-red-600 text-sm"></div>

      <div class="flex items-center gap-3 pt-5 border-t border-gray-100">
        <button type="submit"
                class="bg-blue-900 text-white text-sm px-5 py-2 rounded hover:bg-blue-800 transition">
          Transfer User
        </button>
        <a href="/users/" class="text-sm text-gray-500 hover:text-gray-700">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  Auth.redirectIfNotLoggedIn();

  async function loadUsersAndStates() {
    const [users, states] = await Promise.all([
      API.get('/api/users/list/'),
      API.get('/api/users/states/'),
    ]);

    const userSelect = document.getElementById('user');
    const stateSelect = document.getElementById('state');
    const districtSelect = document.getElementById('district');

    userSelect.innerHTML = '<option value="">Select a user</option>' + (users || []).map(user =>
      `<option value="${user.id}">${user.username} — ${user.state || 'No state'} / ${user.district || 'No district'}</option>`
    ).join('');

    stateSelect.innerHTML = '<option value="">Select a state</option>' + (states || []).map(state =>
      `<option value="${state.id}">${state.name}</option>`
    ).join('');

    stateSelect.addEventListener('change', async () => {
      const stateId = stateSelect.value;
      if (!stateId) {
        districtSelect.innerHTML = '<option value="">Select state first</option>';
        return;
      }
      const districts = await API.get(`/api/users/states/${stateId}/districts/`);
      districtSelect.innerHTML = '<option value="">Select a district</option>' + (districts || []).map(district =>
        `<option value="${district.id}">${district.name}</option>`
      ).join('');
    });
  }

  document.getElementById('transfer-user-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.classList.add('hidden');

    const data = {
      user_id: document.getElementById('user').value,
      to_district: document.getElementById('district').value,
    };

    const res = await API.post('/api/users/transfer-user/', data);
    if (!res || res.error) {
      errorEl.textContent = res.error || res.detail || 'Unable to transfer user.';
      errorEl.classList.remove('hidden');
      return;
    }

    window.location.href = '/users/';
  });

  loadUsersAndStates();
</script>
{% endblock %}
