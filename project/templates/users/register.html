{% extends 'base.html' %}

{% block title %}Register User — EMS Portal{% endblock %}
{% block page_title %}Register User{% endblock %}

{% block content %}
<div class="max-w-3xl">
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form id="register-form" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input id="username" type="text" required
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="email" type="email" required
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mobile</label>
          <input id="mobile" type="text" required
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
          <select id="role" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
          <select id="state" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">District</label>
          <select id="district" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password" type="password" required min="8"
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
          <input id="password_confirm" type="password" required min="8"
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Profile Image</label>
        <input id="profile_image" type="file" accept="image/*"
               class="w-full text-sm text-gray-700" />
      </div>

      <div id="form-error" class="hidden text-red-600 text-sm"></div>

      <div class="flex items-center gap-3 pt-5 border-t border-gray-100">
        <button id="register-button" type="submit"
                class="bg-blue-900 text-white text-sm px-5 py-2 rounded hover:bg-blue-800 transition">
          Register User
        </button>
        <a href="/users/" class="text-sm text-gray-500 hover:text-gray-700">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  Auth.redirectIfNotLoggedIn();

  async function loadSelectOptions() {
    const [roles, states] = await Promise.all([
      API.get('/api/users/roles/'),
      API.get('/api/users/states/'),
    ]);

    const roleSelect = document.getElementById('role');
    const stateSelect = document.getElementById('state');
    const districtSelect = document.getElementById('district');

    [roles, states].forEach((items, index) => {
      const select = index === 0 ? roleSelect : stateSelect;
      if (!items) return;
      select.innerHTML = '<option value="">Select</option>' + items.map(item =>
        `<option value="${item.id}">${item.name}</option>`
      ).join('');
    });

    stateSelect.addEventListener('change', async () => {
      const stateId = stateSelect.value;
      if (!stateId) {
        districtSelect.innerHTML = '<option value="">Select state first</option>';
        return;
      }
      const districts = await API.get(`/api/users/states/${stateId}/districts/`);
      districtSelect.innerHTML = '<option value="">Select</option>' + (districts || []).map(item =>
        `<option value="${item.id}">${item.name}</option>`
      ).join('');
    });
  }

  document.getElementById('register-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.classList.add('hidden');

    const formData = new FormData();
    formData.append('username', document.getElementById('username').value);
    formData.append('email', document.getElementById('email').value);
    formData.append('mobile', document.getElementById('mobile').value);
    formData.append('role', document.getElementById('role').value);
    formData.append('state', document.getElementById('state').value);
    formData.append('district', document.getElementById('district').value);
    formData.append('password', document.getElementById('password').value);
    formData.append('password_confirm', document.getElementById('password_confirm').value);
    const fileInput = document.getElementById('profile_image');
    if (fileInput.files.length) formData.append('profile_image', fileInput.files[0]);

    const res = await fetch('/api/users/register/', {
      method: 'POST',
      body: formData,
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.detail || JSON.stringify(data);
      errorEl.classList.remove('hidden');
      return;
    }
    window.location.href = '/users/';
  });

  loadSelectOptions();
</script>
{% endblock %}
